name: cron probe (temporal, diagnostico)

# Reconfigurada 2026-07-31 tras red-team: horaria a minuto valle (:37), no */5.
# Repo ANTIGUO (2025-02) — tercera dimension del experimento frente a los dos
# repos de julio 2026. CONGELADA hasta 2026-08-03: cada edicion re-registra el
# workflow (#185373). NO editar, NO borrar hasta veredicto.

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          date -u +%FT%TZ
