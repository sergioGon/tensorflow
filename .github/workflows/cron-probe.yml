name: cron probe (temporal, diagnostico)

# Diagnostico temporal 2026-07-31: tercera dimension del experimento.
# Este es un repo ANTIGUO (2025-02) — los otros dos repos probados se crearon
# en julio de 2026. Si este cron dispara y los otros no, el problema esta
# ligado a la fecha de creacion del repo. Se borra al acabar.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "event=${{ github.event_name }}"
          date -u +%FT%TZ
